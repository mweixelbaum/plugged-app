name: Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: bash scripts/ci-run.sh "Windows-Build" npm run build:windows
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: bash scripts/ci-run.sh "Linux-Build" npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Das Android SDK ist auf den GitHub-Runnern vorinstalliert (ANDROID_HOME).
      - run: bash scripts/ci-run.sh "NDK installieren" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: npm ci
      # Signatur: Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD anlegen.
      - name: Keystore einrichten
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/ci-run.sh "Android-Build" npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  # iPhone: unsignierte .ipa (zum Sideloaden mit Sideloadly/AltStore) + Simulator-Screenshots.
  # Braucht kein Apple-Developer-Konto. gen/apple wird bei jedem Lauf frisch erzeugt.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: brew install xcodegen
      - run: npm ci
      - run: bash scripts/ci-run.sh "iOS-Init" npx tauri ios init --ci
      # --archive-only: Tauri findet die .app nach dem Archivieren nicht (anderer Name),
      # deshalb packt scripts/ios-package-ipa.sh die .ipa selbst.
      - name: IPA bauen (unsigniert)
        run: bash scripts/ci-run.sh "IPA-Build" npx tauri ios build --no-sign --archive-only --target aarch64
      - name: IPA packen
        run: bash scripts/ci-run.sh "IPA packen" bash scripts/ios-package-ipa.sh ios-build plugged
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios-build/*.ipa
      - name: Simulator-Build
        run: |
          rm -rf src-tauri/gen/apple/build/*.xcarchive
          bash scripts/ci-run.sh "Simulator-Build" npx tauri ios build --no-sign --archive-only --target aarch64-sim
      - name: Screenshots im iPhone-Simulator
        run: bash scripts/ci-run.sh "Simulator-Screenshots" bash scripts/ios-simulator-screenshot.sh ios-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios-screenshots/
